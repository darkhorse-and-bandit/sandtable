<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <style>
      .wm-text { font-family: 'Segoe UI', 'SF Pro Display', sans-serif; font-weight: 300; fill: #888; opacity: 0.3; }
      .wm-line { stroke: #888; stroke-width: 0.5; opacity: 0.15; }
    </style>
  </defs>
  <!-- Subtle Sandtable text watermark -->
  <text class="wm-text" x="400" y="380" text-anchor="middle" font-size="72" letter-spacing="12">SANDTABLE</text>
  <text class="wm-text" x="400" y="440" text-anchor="middle" font-size="18" letter-spacing="6" opacity="0.2">RESEARCH WORKSPACE</text>
  <!-- Decorative frame lines -->
  <line class="wm-line" x1="200" y1="340" x2="600" y2="340"/>
  <line class="wm-line" x1="200" y1="460" x2="600" y2="460"/>
  <line class="wm-line" x1="200" y1="340" x2="200" y2="460"/>
  <line class="wm-line" x1="600" y1="340" x2="600" y2="460"/>
  <!-- Corner marks -->
  <path class="wm-line" d="M190 350 L190 340 L200 340" fill="none"/>
  <path class="wm-line" d="M610 350 L610 340 L600 340" fill="none"/>
  <path class="wm-line" d="M190 450 L190 460 L200 460" fill="none"/>
  <path class="wm-line" d="M610 450 L610 460 L600 460" fill="none"/>
</svg>
