<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4488bb" stroke-width="0.3" opacity="0.4"/>
    </pattern>
    <pattern id="largeGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#4488bb" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#largeGrid)"/>
  <!-- Cross-hairs at center -->
  <line x1="400" y1="0" x2="400" y2="800" stroke="#4488bb" stroke-width="0.5" opacity="0.3" stroke-dasharray="8,4"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#4488bb" stroke-width="0.5" opacity="0.3" stroke-dasharray="8,4"/>
  <circle cx="400" cy="400" r="4" fill="none" stroke="#4488bb" stroke-width="0.5" opacity="0.4"/>
</svg>
